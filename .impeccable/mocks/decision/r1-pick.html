<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#ffffff;font-family:'Red Hat Display',sans-serif;color:#101418}
.top{background:#0b3d91;color:#fff;padding:16px 20px 18px}
.bar{display:flex;justify-content:space-between;align-items:center}
.club{font-weight:900;font-size:22px}
.bell{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center}
.pics{display:flex;gap:8px;margin-top:14px}
.pic{width:44px;height:44px;border-radius:8px;display:grid;place-items:center}
.next{margin:16px;display:flex;gap:14px;align-items:center;border:2px solid #101418;border-radius:14px;padding:12px}
.big{width:72px;height:72px;border-radius:12px;background:#d52b1e;display:grid;place-items:center;flex:none}
.next p{font-size:15px;color:#3b4350}
.next b{display:block;font-size:30px;font-weight:900;color:#101418;line-height:1.05}
.cta{margin:0 16px;height:58px;border-radius:12px;background:#f2a900;display:grid;place-items:center;font-weight:900;font-size:20px}
h2{font-weight:900;font-size:20px;margin:22px 20px 10px}
.days{display:flex;gap:6px;padding:0 16px}
.d{flex:1;height:60px;border-radius:10px;background:#eef1f6;text-align:center;padding-top:8px;font-size:13px;font-weight:500;color:#3b4350}
.d b{display:block;font-size:22px;font-weight:900;color:#101418}
.d.on{background:#0b3d91;color:#dce6f7}.d.on b{color:#fff}
.rows{margin:14px 16px 0}
.r{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e3e7ee}
.ic{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;flex:none}
.nm{width:74px;font-weight:700;font-size:15px}
.sl{display:flex;gap:6px}
.s{height:40px;min-width:52px;border-radius:8px;border:2px solid #101418;display:grid;place-items:center;font-weight:700;font-size:15px}
.s.x{border-color:#e3e7ee;background:#eef1f6;color:#4a5260}
.s.me{background:#007a3d;border-color:#007a3d;color:#fff}
.tab{position:absolute;left:0;right:0;bottom:0;height:74px;border-top:1px solid #e3e7ee;display:flex;justify-content:space-around;align-items:center;font-size:13px;font-weight:700;color:#3b4350}
.tab .a{color:#0b3d91}
.tab div{display:flex;flex-direction:column;align-items:center;gap:4px}
.tab i{width:24px;height:24px;border-radius:6px;border:2.5px solid currentColor}
</style></head><body>
<div class="top"><div class="bar"><div class="club">Palle Girate</div><div class="bell"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/></svg></div></div>

<div class="pic" style="background:#f2a900"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#101418" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18"/></svg></div>
<div class="pic" style="background:#ffffff"><svg width="26" height="26" viewBox="0 0 24 24" fill="#0b3d91"><circle cx="8" cy="15" r="5"/><circle cx="17" cy="12" r="3"/></svg></div>
</div></div>
<div class="next"><div class="big"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><ellipse cx="10" cy="9" rx="6" ry="6"/><path d="M14 13l6 7"/></svg></div><p>Sab 26 ottobre · Tennis 1<b>18:00–19:00</b></p></div>
<div class="cta">Prenota un campo</div>
<h2>Disponibilità di oggi</h2>
<div class="days"><div class="d on">Ven<b>25</b></div><div class="d">Sab<b>26</b></div><div class="d">Dom<b>27</b></div><div class="d">Lun<b>28</b></div><div class="d">Mar<b>29</b></div></div>
<div class="rows">
<div class="r"><div class="ic" style="background:#009246"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="9"/></svg></div><div class="nm">Calcio</div><div class="sl"><div class="s x">17:00</div><div class="s">18:30</div><div class="s">20:00</div></div></div>
<div class="r"><div class="ic" style="background:#d52b1e"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><ellipse cx="10" cy="9" rx="6" ry="6"/></svg></div><div class="nm">Tennis 1</div><div class="sl"><div class="s">17:00</div><div class="s me">18:00</div><div class="s x">19:00</div></div></div>
<div class="r"><div class="ic" style="background:#d52b1e"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><ellipse cx="10" cy="9" rx="6" ry="6"/></svg></div><div class="nm">Tennis 2</div><div class="sl"><div class="s">17:00</div><div class="s">18:00</div><div class="s">19:00</div></div></div>
<div class="r"><div class="ic" style="background:#f2a900"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#101418" stroke-width="2.5"><circle cx="12" cy="12" r="9"/></svg></div><div class="nm">Basket</div><div class="sl"><div class="s x">17:00</div><div class="s x">18:00</div><div class="s">19:00</div></div></div>
</div>
<div class="tab"><div class="a"><i></i>Home</div><div><i></i>Campi</div><div><i></i>Prenota</div><div><i></i>Le mie</div></div>
</body></html>
